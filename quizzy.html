<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFCE Chapter 1 Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 56px;
        }
        .book-writeup {
            background-color: #f8f9fa;
            padding: 2rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
        }

        .quiz-header {
            background-color: #007bff;
            color: white;
            padding: 0.3rem;
            margin-bottom: 0.3rem;
            border-radius: 0.3rem;
        }

        .score-box {
            font-weight: bold;
            align-items: right;
            font-size: 1.2rem;
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .card:hover {
            box-shadow: 8px 8px 8px rgba(0, 0, 0, 0.05);
            transform: scale(1.01);
        }

        .feedback {
            font-style: italic;
            margin-top: 0.5rem;
        }

        .option-label.correct {
            color: #198754;
            font-weight: bold;
        }

        .option-label.incorrect {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/ifce/index.html">IFCE Exam Prep</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="book-writeup">
        <div class="quiz-header text-center">
            <h1>My IFCE Quiz</h1>
            <p class="lead">Test your knowledge with these multiple choice questions!</p>
        </div>

        <div class="mb-4">
            <h5 class="text-center">Your Score</h5>
            <div class="table-responsive">
                <table class="table table-bordered text-center score-table table-sm">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Correct</th>
                        <th scope="col">Incorrect</th>
                        <th scope="col">Answered</th>
                        <th scope="col">Score(%)</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td id="score">0</td>
                        <td id="incorrect">0</td>
                        <td id="answered">0</td>
                        <td><span id="score_percent">0</span><span>%</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3"></div>
        <form id="quiz-form">
            <div id="quiz-questions" class="vstack gap-4">
                <!-- Questions will be injected here -->
            </div>
        </form>
        <div id="ErrorBox"></div>
    </div>
</div>

<!-- Bootstrap JS (optional for interactivity) -->

<script src="js/quiz.js"></script>
<script>
    show_quiz();
</script>

<footer class="py-5 bg-dark">
    <div class="container">
        <p class="m-0 text-center text-white">Copyright &copy; Your Website 2025</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
