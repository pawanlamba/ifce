<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFCE Chapter 1 Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 56px;
        }
        .book-writeup {
            background-color: #f8f9fa;
            padding: 2rem;
            border-radius: 0.5rem;
            margin-bottom: 2rem;
        }

        .quiz-header {
            background-color: #007bff;
            color: white;
            padding: 0.3rem;
            margin-bottom: 0.3rem;
            border-radius: 0.3rem;
        }

        .score-box {
            font-weight: bold;
            align-items: right;
            font-size: 1.2rem;
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .card:hover {
            box-shadow: 8px 8px 8px rgba(0, 0, 0, 0.05);
            transform: scale(1.01);
        }

        .feedback {
            font-style: italic;
            margin-top: 0.5rem;
        }

        .option-label.correct {
            color: #198754;
            font-weight: bold;
        }

        .option-label.incorrect {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="/index.html">IFCE Exam Prep</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="book-writeup">
        <div class="quiz-header text-center">
            <h1>My IFCE Quiz</h1>
            <p class="lead">Test your knowledge with these multiple choice questions!</p>
        </div>

        <div class="mb-4">
            <h5 class="text-center">Your Score</h5>
            <div class="table-responsive">
                <table class="table table-bordered text-center score-table table-sm">
                    <thead class="table-light">
                    <tr>
                        <th scope="col">Correct</th>
                        <th scope="col">Incorrect</th>
                        <th scope="col">Answered</th>
                        <th scope="col">Score(%)</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td id="score">0</td>
                        <td id="incorrect">0</td>
                        <td id="answered">0</td>
                        <td><span id="score_percent">0</span><span>%</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3"></div>
        <form id="quiz-form">
            <div id="quiz-questions" class="vstack gap-4">
                <!-- Questions will be injected here -->
            </div>
        </form>
        <div id="ErrorBox"></div>
    </div>
</div>

<!-- Bootstrap JS (optional for interactivity) -->

<script>
    // Read query parameters
    const params = new URLSearchParams(window.location.search);
    const url = params.get('url');

    let score = 0;
    let answered = 0;

    if (url) {
      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error("Network response was not ok");
          return response.json();
        })
        .then(questions => renderQuiz(questions))
        .catch(err => {
          console.error("Error fetching or parsing JSON:", err);
          document.getElementById('ErrorBox').textContent = 'Error fetching data.';
        });
    } else {
      document.getElementById('ErrorBox').textContent = 'Missing JSON URL parameter.';
    }

    function renderQuiz(questions) {
        const quizContainer = document.getElementById('quiz-questions');

        questions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'card p-4';

            const questionTitle = document.createElement('h5');
            questionTitle.textContent = `${index + 1}. ${q.Question}`;
            card.appendChild(questionTitle);

            const optionsGroup = document.createElement('div');
            optionsGroup.className = 'mt-3';

            for (let i = 1; i <= 4; i++) {
                const optionId = `q${index}_opt${i}`;
                const wrapper = document.createElement('div');
                wrapper.className = 'form-check';

                const input = document.createElement('input');
                input.className = 'form-check-input';
                input.type = 'radio';
                input.name = `question${index}`;
                input.id = optionId;
                input.value = i;
                input.onclick = () => handleAnswer(input, q, index);

                const label = document.createElement('label');
                label.className = 'form-check-label option-label';
                label.htmlFor = optionId;
                label.textContent = q[i];

                wrapper.appendChild(input);
                wrapper.appendChild(label);
                optionsGroup.appendChild(wrapper);
            }

            const feedback = document.createElement('div');
            feedback.className = 'feedback text-muted';
            feedback.id = `feedback${index}`;

            card.appendChild(optionsGroup);
            card.appendChild(feedback);
            quizContainer.appendChild(card);
        });
    }

    function handleAnswer(input, question, index) {
        const selected = input.value;
        const feedback = document.getElementById(`feedback${index}`);
        const options = document.getElementsByName(`question${index}`);

        options.forEach(opt => opt.disabled = true); // Disable all options

        const labels = Array.from(document.querySelectorAll(`input[name="question${index}"]`)).map(input => {
            return document.querySelector(`label[for="${input.id}"]`);
        });

        if (selected === question.correct) {
            input.nextElementSibling.classList.add('correct');
            score++;
            document.getElementById('score').textContent = score;
        } else {
            input.nextElementSibling.classList.add('incorrect');
            const correctInput = Array.from(options).find(opt => opt.value === question.correct);
            if (correctInput) {
                correctInput.nextElementSibling.classList.add('correct');
            }
        }
        // Handle Percentage
        answered++;
        score_percent = (score / answered * 100.0).toFixed(2);
        incorrect = answered - score;
        document.getElementById('incorrect').textContent = incorrect;
        document.getElementById('answered').textContent = answered;
        document.getElementById('score_percent').textContent = score_percent;

        feedback.textContent = "Correct Answer: " + question.correct + ",Explanation: " + question.reason;
    };

</script>
</div>
<footer class="py-5 bg-dark">
    <div class="container">
        <p class="m-0 text-center text-white">Copyright &copy; Your Website 2025</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
